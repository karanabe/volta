[package]
name = "volta"
version = "3.0.0-alpha.3"
license = "BSD-2-Clause"
repository = "https://github.com/karanabe/volta"
edition = "2024"

[features]
cross-platform-docs = ["volta-core/cross-platform-docs"]
mock-network = ["mockito", "volta-core/mock-network"]
volta-dev = []
smoke-tests = []

[[bin]]
name = "volta-shim"
path = "src/volta-shim.rs"

[[bin]]
name = "volta-migrate"
path = "src/volta-migrate.rs"

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
volta-core = { path = "crates/volta-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
once_cell = "1.21.4"
log = { version = "0.4.34", features = ["std"] }
node-semver = "2.2.0"
clap = { version = "4.6.6", features = ["color", "derive", "wrap_help"] }
clap_complete = "4.6.9"
mockito = { version = "1.7.2", optional = true }
textwrap = "0.16.3"
which = "8.0.6"
dirs = "7.0.0"
volta-migrate = { path = "crates/volta-migrate" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
sha2 = "0.10.9"
base64 = "0.22.1"
hamcrest2 = "0.3.0"
envoy = "0.1.3"
ci_info = "0.14.15"
headers = "0.4.1"
cfg-if = "1.0.4"
test-support = { path = "crates/test-support" }

[workspace]
