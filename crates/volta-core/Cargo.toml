[package]
name = "volta-core"
version = "0.1.0"
authors = ["David Herman <david.herman@gmail.com>"]
edition = "2021"

[features]
mock-network = ["mockito"]
# The `cross-platform-docs` feature flag is used for generating API docs for
# multiple platforms in one build.
# See ci/publish-docs.yml for an example of how it's enabled.
# See volta-core::path for an example of where it's used.
cross-platform-docs = []

[dependencies]
terminal_size = "0.4.4"
indicatif = "0.18.6"
console = ">=0.16.6, <1.0.0"
readext = "0.1.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
archive = { path = "../archive" }
node-semver = "2.2.0"
cmdline_words_parser = "0.2.1"
fs-utils = { path = "../fs-utils" }
cfg-if = "1.0.4"
tempfile = "3.27.0"
os_info = "3.15.0"
detect-indent = "0.1"
envoy = "0.1.3"
mockito = { version = "0.31.1", optional = true }
regex = "1.13.1"
dirs = "6.0.0"
# We manually configure the feature list here because 0.4.16 includes the
# `oldtime` feature by default to avoid a breaking change. Additionally, using
# the feature list explicitly lets us drop the `wasmbind` feature, which we do
# not need.
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std", "clock"] }
validate-npm-package-name = { path = "../validate-npm-package-name" }
textwrap = "0.16.3"
log = { version = "0.4.34", features = ["std"] }
ctrlc = "3.5.2"
walkdir = "2.5.0"
volta-layout = { path = "../volta-layout" }
once_cell = "1.21.4"
dunce = "1.0.5"
ci_info = "0.14.15"
httpdate = "1"
headers = "0.4.1"
attohttpc = { version = "0.28.5", default-features = false, features = ["json", "compress", "tls-rustls-native-roots"] }
chain-map = "0.1.0"
indexmap = "2.14.2"
retry = "2.2.0"
fs2 = "0.4.3"
which = "7.0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
junction = "1.4.2"
