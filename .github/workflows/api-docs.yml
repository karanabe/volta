on:
  workflow_dispatch:

name: API Docs

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up cargo
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: |
          cargo doc --all --features cross-platform-docs --no-deps --document-private-items
      - name: Prepare docs for publication
        run: |
          mkdir -p publish
          mv target/doc publish/main
          echo '<!doctype html><a href="volta">volta</a>' > publish/main/index.html
          echo '<!doctype html><a href="main">main</a>' > publish/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
