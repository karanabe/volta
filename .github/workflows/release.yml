on:
  push:
    tags:
      - v*
  workflow_dispatch:

name: Release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./ci/docker
          push: false
          load: true
          tags: volta
      - name: Compile and package Volta
        run: docker run --volume "${PWD}:/root/workspace" --workdir /root/workspace --rm --init volta /root/workspace/ci/build-linux.sh volta-linux
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/volta-linux.tar.gz

  linux-arm:
    name: Build - Linux ARM
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install cross-rs
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Compile Volta
        run: cross build --release --target aarch64-unknown-linux-gnu
      - name: Package Volta
        run: |
          cd target/aarch64-unknown-linux-gnu/release && tar -zcvf "volta-linux-arm.tar.gz" volta volta-shim volta-migrate
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm
          path: target/aarch64-unknown-linux-gnu/release/volta-linux-arm.tar.gz

  macos:
    name: Build - MacOS
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up cargo
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compile and package Volta
        run: ./ci/build-macos.sh volta-macos
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/universal-apple-darwin/release/volta-macos.tar.gz

  windows:
    name: Build - Windows
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up cargo
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Add cargo-wix subcommand
        run: cargo install --locked cargo-wix
      - name: Compile and package installer
        run: |
          cargo wix --nocapture --package volta --output target\wix\volta-windows.msi
      - name: Create zip of binaries
        run: powershell Compress-Archive volta*.exe volta-windows.zip
        working-directory: ./target/release
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/wix/volta-windows.msi
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: target/release/volta-windows.zip

  windows-arm:
    name: Build - Windows ARM
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up cargo
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-pc-windows-msvc
          rustflags: ""
      - name: Add cargo-wix subcommand
        run: cargo install --locked cargo-wix
      - name: Compile and package installer
        run: |
          cargo wix --nocapture --package volta --target aarch64-pc-windows-msvc --output target\wix\volta-windows-arm.msi
      - name: Create zip of binaries
        run: powershell Compress-Archive volta*.exe volta-windows-arm.zip
        working-directory: ./target/aarch64-pc-windows-msvc/release
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-arm
          path: target/wix/volta-windows-arm.msi
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-arm
          path: target/aarch64-pc-windows-msvc/release/volta-windows-arm.zip

  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux
      - linux-arm
      - macos
      - windows
      - windows-arm
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Validate release version
        id: release_info
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$package_version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fetch Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release
      - name: Fetch Linux ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arm
          path: release
      - name: Fetch MacOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release
      - name: Fetch Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Fetch Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release
      - name: Fetch Windows ARM installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-arm
          path: release
      - name: Fetch Windows ARM zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip-arm
          path: release
      - name: Prepare release assets
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          cp release/volta-linux.tar.gz "dist/volta-$VERSION-linux.tar.gz"
          cp release/volta-linux-arm.tar.gz "dist/volta-$VERSION-linux-arm.tar.gz"
          cp release/volta-macos.tar.gz "dist/volta-$VERSION-macos.tar.gz"
          cp release/volta-windows.msi "dist/volta-$VERSION-windows-x86_64.msi"
          cp release/volta-windows.zip "dist/volta-$VERSION-windows.zip"
          cp release/volta-windows-arm.msi "dist/volta-$VERSION-windows-arm64.msi"
          cp release/volta-windows-arm.zip "dist/volta-$VERSION-windows-arm64.zip"

          cp release/volta-windows.msi dist/volta-windows-x86_64.msi
          cp release/volta-windows-arm.msi dist/volta-windows-arm64.msi
          cp ci/volta.manifest dist/volta.manifest
          cp dev/unix/volta-install.sh dist/volta-install.sh
          printf '%s\n' "$VERSION" > dist/latest-version

          cd dist
          sha256sum volta-*.tar.gz volta-*.msi volta-*.zip > SHA256SUMS
          ls -la
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes \
              --title "$TAG" --latest
          fi
